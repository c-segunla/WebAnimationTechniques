<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <title>Bouncing Clouds</title>
        <script src="https://www.kirupa.com/js/prefixfree.min.js"></script>
        <style>
        #mainContent {
        background: #21374a;
        border-radius: 4px;
        padding: 10px;
        width: 600px;
        height: 300px;
        overflow: hidden;
        }
        .cloud {
        position: absolute;
        }
        #bigcloud {
        margin-left: 100px;
        margin-top: 15px;
        }
        .transformed-element {
        transform: matrix(1.17368, 2.20737, -2.20737, 1.17368, 0, 0);
        }
        </style>
    </head>

    <body id="mainContent">
        <div>
        <img id="bigcloud" alt="#" class="cloud transformed-element" height="154" src="https://www.kirupa.com/images/bigCloud.png" width="238">
        </div>
    </body>

</html>
